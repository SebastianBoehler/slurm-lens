[package]
name = "slurm-lens"
version = "0.1.0"
edition = "2024"
description = "A local, read-only workspace for understanding recorded Slurm jobs"
license = "MIT"
repository = "https://github.com/SebastianBoehler/slurm-lens"
readme = "README.md"
keywords = ["slurm", "hpc", "dashboard", "gpu"]
categories = ["visualization"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = true
strip = true
codegen-units = 1

