[package]
name = "slurm-lens"
version = "0.2.0"
edition = "2024"
description = "A read-only Slurm dashboard with live REST streaming and recording playback"
license = "MIT"
repository = "https://github.com/SebastianBoehler/slurm-lens"
readme = "README.md"
keywords = ["slurm", "hpc", "dashboard", "gpu"]
categories = ["visualization"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-stream = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

